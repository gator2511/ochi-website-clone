<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>GT Marketing contact form</title>
	</head>
	<body>
		<!-- Static skeleton so Netlify can detect the form at build time. Field names must match the React form. -->
		<form name="gt-marketing-contact" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="gt-marketing-contact" />
			<input type="hidden" name="subject" />
			<input type="text" name="name" />
			<input type="tel" name="phone" />
			<textarea name="need"></textarea>
			<input type="email" name="email" />
			<input name="bot-field" />
		</form>
		<!-- Field names must match the free SEO audit React form. -->
		<form name="free-seo-audit" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="free-seo-audit" />
			<input type="hidden" name="subject" />
			<input type="text" name="name" />
			<input type="text" name="business-name" />
			<input type="url" name="website" />
			<input type="tel" name="phone" />
			<input type="email" name="email" />
			<input type="text" name="service-suburb" />
			<input name="bot-field" />
		</form>
	</body>
</html>
