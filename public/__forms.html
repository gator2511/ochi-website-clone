<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>GT Marketing contact form</title>
	</head>
	<body>
		<form name="gt-marketing-contact" method="POST" data-netlify="true">
			<input type="hidden" name="form-name" value="gt-marketing-contact" />
			<input type="hidden" name="subject" />
			<input type="text" name="name" />
			<input type="text" name="company" />
			<input type="text" name="goal" />
			<input type="text" name="deadline" />
			<input type="text" name="budget" />
			<input type="email" name="email" />
			<input type="text" name="details" />
			<input type="checkbox" name="privacy_consent" value="yes" />
		</form>
	</body>
</html>
