# GT Marketing Netlify build configuration
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.gtmarketing.io/*"
  to = "https://gtmarketing.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ochi-team"
  to = "/about-us"
  status = 301
  force = true
