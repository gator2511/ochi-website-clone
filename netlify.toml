# GT Marketing Netlify build configuration
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Absolute-URL rules, same shape as the working www.gtmarketing.io redirects.
# A Host condition on /* does not run: the Next.js runtime serves gtmarketingio.netlify.app with 200.
[[redirects]]
  from = "https://gtmarketingio.netlify.app/*"
  to = "https://gtmarketing.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://gtmarketingio.netlify.app/*"
  to = "https://gtmarketing.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gtmarketingio.netlify.app/*"
  to = "https://gtmarketing.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.gtmarketingio.netlify.app/*"
  to = "https://gtmarketing.io/:splat"
  status = 301
  force = true

